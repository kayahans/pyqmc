# QMC calculation configuration
# Local/Mac defaults below. For cluster MPI runs (see job.sh):
#   parallel_backend: mpi
#   vmc_nconfig: 1280, dmc_eq_nblocks: 5000, dmc_stat_nconfig: 12800,
#   dmc_stat_nstep: 100000, dmc_stat_nsteps_per_block: 20, vmc_nstep: 5000
atom_name: "b"
xc: "LDA,VWN"
basis_name: "ccecp-aug-cc-pvdz"
ecp: "ccecp"
checkfile_dir: "wfs"
symm_tag: ""
ncas: 8
nelecas: [1, 1]
ion_cusp: False
na: 1
nb: 1
rcut: 5
det_emax: '0.65,singles'
exclude_core: False

# MF local-energy backend for Vj/Vxc: numba (fast) or pyscf (oracle)
evaluate_mf_with: pyscf

# Parallelism: process (ProcessPool, Mac/local), mpi (MPIPool + job.sh), serial
parallel_backend: process
npartitions: null  # null -> cpu_count()-1 for process; MPI uses COMM_WORLD.size-1

# Timesteps
dtwarmup: 0.5
dmc_eq_dt: 0.02
dmc_stat_dt: 0.005

# Local-scale walker / block counts
vmc_nconfig: 512
vmc_nstep: 200
dmc_eq_nblocks: 200
dmc_stat_nconfig: 512
dmc_stat_nstep: 500
dmc_stat_nsteps_per_block: 5
